services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coldlineage
      POSTGRES_PASSWORD: coldlineage
      POSTGRES_DB: coldlineage
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U coldlineage"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://coldlineage:coldlineage@postgres:5432/coldlineage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: coldlineage-archive
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://host.docker.internal:8080}
      DATAHUB_TOKEN: ${DATAHUB_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    volumes: ["./backend/app:/app/app"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
  miniodata:
