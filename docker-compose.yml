# ColdLineage demo stack.
#
# This brings up the warehouse, the cold tier, the executor and the UI. It does NOT
# bring up DataHub -- DataHub is a real external system here, started separately with
# `datahub docker quickstart`, exactly as it would be in any environment where it was
# already your catalog. See README for the two-command setup.
#
# Ports are overridable because 8080 and 3000 are commonly already in use. Copy
# .env.example to .env and edit it, or set the vars inline:
#   DATAHUB_GMS_URL=http://host.docker.internal:8090 UI_PORT=3100 docker compose up -d
# docker compose reads .env from this directory automatically.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coldlineage
      POSTGRES_PASSWORD: coldlineage
      POSTGRES_DB: coldlineage
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldlineage"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://coldlineage:coldlineage@postgres:5432/coldlineage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: coldlineage-archive
      # live  -> read and write a real DataHub
      # replay -> serve the recorded GMS responses committed in examples/cassettes/
      DATAHUB_MODE: ${DATAHUB_MODE:-live}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://host.docker.internal:8080}
      DATAHUB_TOKEN: ${DATAHUB_TOKEN:-}
      CASSETTE_DIR: /app/cassettes
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    volumes:
      - "./backend/app:/app/app"
      - "./examples/cassettes:/app/cassettes:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["${UI_PORT:-3000}:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
